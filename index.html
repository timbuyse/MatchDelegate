<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MatchDelegate">
  <meta name="theme-color" content="#101010">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="MD_cropped.png">
  <link rel="apple-touch-icon" href="MD_cropped.png">
  <title>MatchDelegate</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --blk:#0f172a;--blk2:#1e293b;--blk3:#334155;
      --grn:#2f9e57;--grn2:#247d44;--grnp:#dcf1e3;--grnb:#aedcbd;
      --org:#2f74bd;--org2:#255f9c;--orgp:#e1edf8;--orgb:#bdd6ef;
      --tel:#0d9488;--tel2:#0f766e;--telp:#ccfbf1;
      --orn:#f97316;--orn2:#c2410c;--ornp:#ffedd5;
      --yl:#eab308;--ylp:#fef9c3;--rd:#dc2626;--rdp:#fee2e2;--bl:#2563eb;--blp:#eff6ff;
      --bg:#f5f6f5;--card:#fff;--txt:#171717;--txt2:#6b7280;--bdr:#e5e7eb;
      --shadow:0 2px 8px rgba(0,0,0,.1)
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;overflow-x:hidden}
    /* Header */
    .hdr{background:url('background_logo.jpg') center/cover no-repeat;color:#fff;padding:14px 20px;min-height:80px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.4);border-bottom:none;position:relative;box-sizing:border-box}
    .hdr::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:0;pointer-events:none}
    .hdr>*{position:relative;z-index:1}
    .hdr h1{font-size:17px;font-weight:700;flex:1}
    .hdr-sub{font-size:12px;opacity:.7}
    .back{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:2px 4px;line-height:1}
    .hdr-btn{background:var(--org);border:none;color:#fff;font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer}
    .hdr-logo{width:30px;height:30px;border-radius:7px;flex-shrink:0}
    .hdr-home{justify-content:center;padding:14px 20px}
    .hdr-fulllogo{height:44px;width:auto}
    .credit{text-align:center;font-size:12px;color:var(--txt2);padding:4px 0 28px}
    .credit b{color:var(--blk)}
    .credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .hdr-gear{background:none;border:none;color:#fff;font-size:21px;cursor:pointer;opacity:.85;padding:6px;z-index:2;flex-shrink:0}
    .hdr-crest{height:44px;width:44px;object-fit:contain;flex-shrink:0}
    .hdr-clubname{font-size:17px;font-weight:800;color:#fff;margin-left:9px}
    .logo-preview{display:flex;justify-content:center;margin-bottom:10px}
    .logo-preview img{max-height:120px;max-width:85%;object-fit:contain;background:var(--blk);border-radius:12px;padding:12px}
    .logo-empty{height:110px;width:100%;max-width:85%;border:2px dashed var(--bdr);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;font-weight:600}
    .file-btn{display:block;width:100%;padding:13px;border:2px dashed var(--grnb);border-radius:10px;text-align:center;font-size:14px;font-weight:700;color:var(--grn2);cursor:pointer;background:var(--grnp)}
    .file-btn input[type=file]{display:none}
    .welcome{text-align:center;padding:8px 4px 16px}
    .welcome h2{font-size:22px;margin-bottom:6px}
    .welcome p{font-size:14px;color:var(--txt2);line-height:1.5}
    /* Content */
    .content{padding:16px;max-width:600px;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    /* Card */
    .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;min-height:50px;width:100%;transition:opacity .15s,transform .1s}
    .btn:active{transform:scale(.97);opacity:.85}
    .btn-green{background:var(--grn);color:#fff}
    .btn-org{background:var(--org);color:#fff}
    .btn-orn{background:var(--orn);color:#fff}
    .btn-dark{background:var(--blk);color:#fff}
    .btn-pale{background:var(--grnp);color:var(--grn2)}
    .btn-orgpale{background:var(--orgp);color:var(--org2)}
    .btn-red{background:var(--rdp);color:var(--rd)}
    .btn-gray{background:#f1f1f1;color:var(--txt)}
    .btn-sm{padding:9px 14px;font-size:14px;min-height:38px;width:auto}
    /* Form */
    .fg{margin-bottom:14px}
    .fg label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
    .fg input,.fg select{width:100%;padding:12px;border:2px solid var(--bdr);border-radius:8px;font-size:16px;color:var(--txt);background:#fff;-webkit-appearance:none}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--grn)}
    .fg textarea{width:100%;padding:12px;border:2px solid var(--bdr);border-radius:8px;font-size:16px;color:var(--txt);font-family:inherit;resize:vertical;-webkit-appearance:none}
    .fg textarea:focus{outline:none;border-color:var(--grn)}
    .fg-pwd{position:relative}.fg-pwd input{padding-right:44px!important}
    .pwd-eye{position:absolute;right:2px;bottom:2px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--txt);opacity:.5;font-size:20px;border-radius:6px;line-height:1}
    .pwd-eye:hover{opacity:1}
    body.dark .pwd-eye{color:#e8eaed}
    .chkrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600;color:var(--txt2);text-transform:none;letter-spacing:0}
    .chkrow input{width:auto;transform:scale(1.3)}
    /* Een aanvinkvakje BINNEN een .fg (v1.9.5). `.fg input` zet -webkit-appearance:none plus een
       rand en padding — bedoeld voor tekstvelden — en een checkbox wordt daardoor een leeg vierkant
       van 36x36 zonder vinkje: je kan hem wél aanklikken, maar je ziet nooit of hij aan of uit staat.
       Dat gebeurde met "Geef me een seintje" bij een geplande wissel (v1.9.1), en dezelfde valkuil
       was eerder al opgelost voor .trn-pick hieronder. Nu generiek voor elke .chkrow, zodat het niet
       een derde keer misloopt. [type=checkbox] maakt dit specifieker dan `.fg input`. */
    .chkrow input[type=checkbox]{-webkit-appearance:auto;appearance:auto;padding:0;border:0;accent-color:var(--grn)}
    /* Aanvinklijst van trainers binnen een .fg: die zet -webkit-appearance op none, waardoor een
       vinkvakje onzichtbaar zou worden. */
    .trn-pick{margin-bottom:2px}
    /* .fg label is specifieker dan .chkrow en zou de namen in hoofdletters zetten. */
    .trn-pick .chkrow{margin-top:4px;font-size:15px;color:var(--txt);font-weight:600;text-transform:none;letter-spacing:0}
    .trn-pick input[type=checkbox]{-webkit-appearance:auto;appearance:auto;padding:0;border:0;accent-color:var(--grn);margin-right:2px}
    .team-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .team-chips-lbl{width:100%;font-size:12px;color:var(--txt2);font-weight:600;text-transform:none;letter-spacing:0;margin-bottom:2px}
    .team-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 5px 6px 12px;border-radius:20px;border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .team-chip-x{border:none;background:var(--rdp);color:var(--rd);width:21px;height:21px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .filterbar{margin-bottom:12px}
    .filterbar select{width:100%;padding:11px;border:2px solid var(--bdr);border-radius:10px;font-size:15px;background:#fff;font-weight:600;color:var(--txt);-webkit-appearance:none}
    .notes-txt{white-space:pre-wrap;font-size:14px;line-height:1.45}
    .more-details{margin-top:6px;border-top:1px solid var(--bdr);padding-top:10px}
    .more-details summary{font-size:13px;font-weight:700;color:var(--grn2);cursor:pointer;list-style:none}
    .more-details summary::-webkit-details-marker{display:none}
    .pmins-low{color:var(--org)!important;font-weight:800}
    /* 28x28 was te klein voor wat deze knop doet: tijdens een lopende wedstrijd haalt hij een speler
       van het veld of gooit hij een geplande wissel weg. Op 36px blijft het een discreet knopje maar
       is het raakvlak ruim een vingertop. .evt-edit staat ernaast in de gebeurtenissenlijst en volgt
       dezelfde maat. */
    .evt-del{margin-left:auto;background:var(--rdp);border:none;color:var(--rd);width:36px;height:36px;border-radius:8px;font-size:17px;cursor:pointer;flex-shrink:0}
    .stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:14px}
    .stat-row:last-child{border-bottom:none}
    /* Klikbare rij (→ spelerdetail). Het chevron maakt zichtbaar dát er een detail achter zit:
       cursor:pointer alleen is op een telefoon onzichtbaar. */
    .stat-row[data-link]::after{content:'›';color:var(--txt2);font-size:18px;line-height:1;margin-left:2px;opacity:.55;flex-shrink:0}
    .stat-rank{width:24px;font-weight:800;color:var(--txt2)}
    .stat-big{display:flex;gap:10px;flex-wrap:wrap}
    .stat-box{flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:12px;text-align:center}
    .stat-box .v{font-size:24px;font-weight:900}
    .stat-box .l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
    /* Section label */
    .sec{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
    /* Inklapbare statistiek-sectie (accordion) */
    .stat-acc{margin-top:14px}
    .stat-acc>summary{list-style:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;padding:8px 0;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bdr)}
    .stat-acc>summary::-webkit-details-marker{display:none}
    .stat-acc>summary::after{content:'▾';margin-left:auto;color:var(--txt2);transition:transform .15s}
    .stat-acc:not([open])>summary::after{transform:rotate(-90deg)}
    .stat-acc>.card{margin-top:10px}
    .stat-eye{margin-left:auto;display:inline-flex;align-items:center;padding:2px 5px;border-radius:6px;color:var(--txt2)}
    .stat-eye.off{opacity:.4}
    .stat-acc>summary:has(.stat-eye)::after{margin-left:6px}
    /* Uitleglijn boven de statistieksecties — zelfde rustige toon als .stat-locked, maar bovenaan. */
    /* Icoon en tekst zijn de ENIGE twee flex-items: de tekst hoort daarom in één <span> te zitten.
       Losse tekst met een <b> erin levert anders vier aparte items op één rij op. Icoon bovenaan
       uitlijnen en niet laten krimpen, zodat het bij een melding van twee regels blijft kloppen. */
    .stat-hint{margin:0 0 12px;padding:10px 14px;font-size:13px;color:var(--txt2);background:var(--bg2,rgba(0,0,0,.04));border-radius:10px;display:flex;align-items:flex-start;gap:8px;line-height:1.45}
    .stat-hint>.ic-i{flex-shrink:0;line-height:1;margin-top:3px}
    .stat-locked{margin-top:14px;padding:12px 14px;text-align:center;font-size:13px;color:var(--txt2);background:var(--bg2,rgba(0,0,0,.04));border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px}
    /* Match list */
    .match-item{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;border-left:5px solid var(--tel)}
    .match-item:active{transform:scale(.99)}
    .match-item.live-border{border-left-color:var(--rd)}
    .live-pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--rd);display:inline-block;flex-shrink:0;animation:livePulse 1.4s ease-in-out infinite}
    @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    @keyframes goalShake{0%,100%{transform:none}20%{transform:scale(1.08) rotate(-2deg)}40%{transform:scale(1.06) rotate(2deg)}60%{transform:scale(1.04) rotate(-1deg)}80%{transform:scale(1.02) rotate(1deg)}}
    .goal-anim{animation:goalShake .55s cubic-bezier(.36,.07,.19,.97) both}
    @keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
    .card-anim{animation:cardFlip .4s ease both}
    .timer-progress-wrap{height:4px;background:var(--bdr);border-radius:2px;margin-top:8px;overflow:hidden}
    .timer-progress-bar{height:4px;background:var(--grn);border-radius:2px;transition:width .9s linear}
    .match-item.plan-border{border-left-color:var(--orn)}
    /* Tornooi heeft zijn eigen kleur, gelijk aan de stip (.cal-dot.trn) en de legende in de agenda —
       de status (afgesloten of niet) zit in de badge, niet in de kleur. */
    .match-item.trn-border{border-left-color:var(--grn)}
    /* Geannuleerd: grijs, want er valt niets te doen en niets te zien. Doelbewust niet rood — rood
       is in dit scherm de kleur van "live". */
    .match-item.cancel-border{border-left-color:var(--txt2)}
    /* Niet afgesloten: geel = "dit wacht op jou". Grijs was al van geannuleerd ("gaat niet door"),
       oranje van gepland — zie matchNietAfgesloten in core.js. */
    .match-item.open-border{border-left-color:var(--yl)}
    .mi-info{flex:1}
    .mi-opp{font-size:16px;font-weight:700}
    .mi-date{font-size:12px;color:var(--txt2);margin-top:2px}
    .mi-score{font-size:28px;font-weight:900;color:var(--blk);font-variant-numeric:tabular-nums}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px}
    .badge-live{background:var(--rdp);color:var(--rd)}
    .badge-done{background:var(--telp);color:var(--tel2)}
    .badge-plan{background:var(--ornp);color:var(--orn2)}
    .badge-trn{background:var(--grnp);color:var(--grn2)}
    .badge-cancel{background:var(--bdr);color:var(--txt2)}
    .badge-open{background:var(--ylp);color:#8a6100}
    .badge-type{background:var(--blk2);color:#fff;margin-left:5px}
    /* Soort wedstrijd (competitie/beker/...): omlijnd i.p.v. gevuld, zodat het naast de gevulde
       statusbadge en de zwarte vorm-badge leesbaar blijft zonder een derde kleur te schreeuwen. */
    .badge-kind{background:transparent;color:var(--txt2);border:1px solid var(--bdr);margin-left:5px}
    /* Strafschoppenreeks: de bolletjes zoals op televisie — groen = raak, rood = gemist. */
    .pen-bol{display:inline-block;width:14px;height:14px;border-radius:50%;flex-shrink:0}
    .pen-bol.raak{background:var(--grn)}
    .pen-bol.mis{background:var(--rd);opacity:.55}
    .badge-pen{background:var(--grnp);color:var(--grn2);margin-left:5px}
    /* Scoreboard */
    .scoreboard{background:var(--blk);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:12px;border-bottom:3px solid var(--org)}
    .sb-teams{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-bottom:4px}
    .sb-score{font-size:64px;font-weight:900;line-height:1;letter-spacing:6px;font-variant-numeric:tabular-nums}
    .sb-score .us{color:var(--grn)}
    .sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:7px;vertical-align:middle}
    .sync-dot.on{background:#22c55e}
    .sync-dot.off{background:#f59e0b;animation:syncPulse 1.6s ease-in-out infinite}
    @keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.35}}
    .grn{color:var(--grn)}
    .sb-info{font-size:13px;opacity:.7;margin-top:6px}
    /* Kalenderweergave van de wedstrijden. Een cel is op een telefoon te smal voor tekst, dus in
       het rooster staan enkel stipjes; de wedstrijden zelf komen onder de kalender te staan zodra
       je een dag aantikt. */
    .cal-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bdr);padding:3px;border-radius:10px;margin-bottom:12px}
    .cal-switch button{padding:8px 10px;border:none;border-radius:8px;background:transparent;color:var(--txt2);font-size:14px;font-weight:700;cursor:pointer}
    .cal-switch button.act{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .cal-nav b{font-size:16px;text-transform:capitalize}
    .cal-nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);color:var(--txt);font-size:18px;cursor:pointer}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;padding-bottom:2px}
    .cal-cell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:2px}
    .cal-cell.leeg{background:transparent;border-color:transparent;cursor:default}
    .cal-cell.buiten{opacity:.35}
    .cal-cell.vandaag{border-color:var(--grn);border-width:2px}
    .cal-cell.sel{background:var(--grnp);border-color:var(--grn)}
    .cal-num{font-size:13px;font-weight:700;line-height:1}
    .cal-dots{display:flex;gap:2px;min-height:6px}
    .cal-dot{width:6px;height:6px;border-radius:50%}
    /* Dezelfde kleuren als de randen in de wedstrijdenlijst (Tim, 23-08-2026). Gepland stond hier op
       --org (dat is in deze app BLAUW, #2f74bd — het oranje heet --orn) terwijl de lijst oranje
       gebruikt, en gespeeld stond op grijs terwijl de lijst groenblauw draagt. Zo beweerden de
       kalender en de lijst iets anders over dezelfde wedstrijd. Grijs is nu vrij voor "niet
       afgesloten"... maar dat werd geel, want grijs is van geannuleerd. */
    .cal-dot.plan{background:var(--orn)}
    .cal-dot.done{background:var(--tel)}
    .cal-dot.open{background:var(--yl)}
    .cal-dot.live{background:var(--rd)}
    .cal-dot.trn{background:var(--grn)}
    /* Hol bolletje: op één stip grootte is een kleurverschil met de volle grijze "gespeeld"-stip niet
       te zien, een lege ring wél — en die leest ook meteen als "hier is niet gespeeld". */
    .cal-dot.cancel{background:transparent;border:1.5px solid var(--txt2);box-sizing:border-box}
    .cal-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0 4px;font-size:11px;color:var(--txt2)}
    .cal-legend span{display:flex;align-items:center;gap:4px}
    /* Timer */
    .timer-card{background:var(--blk2);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}
    .timer-time{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:3px;line-height:1}
    .qdots{display:flex;justify-content:center;gap:8px;margin-top:10px}
    .qdot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
    .qdot.done{background:var(--org)}
    .qdot.active{background:var(--grn)}
    /* Quarter controls */
    .qctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .qbtn{padding:14px 10px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;min-height:50px}
    .qbtn:active{transform:scale(.96)}
    .qbtn-start{background:var(--grn);color:#fff}
    .qbtn-pause{background:var(--ylp);color:var(--yl)}
    .qbtn-end{background:var(--rdp);color:var(--rd)}
    .qbtn-resume{background:var(--blp);color:var(--bl)}
    .qbtn:disabled{opacity:.35;pointer-events:none}
  /* Een uitgeschakelde gewone knop: zichtbaar blijven zodat je weet dát hij bestaat, maar duidelijk
     niet aanklikbaar. Zelfde behandeling als de kwartknoppen hierboven. */
  .btn:disabled{opacity:.4;pointer-events:none}
    /* Event buttons */
    .evtbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}
    .evtbtn{border:2px solid var(--bdr);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--card);transition:transform .1s}
    .evtbtn:active{transform:scale(.93)}
    .evtbtn .ei{font-size:26px;display:block;margin-bottom:3px}
    .evtbtn .el{font-size:11px;font-weight:700;color:var(--txt2)}
    .evtbtn.eg{border-color:var(--grnb);background:var(--grnp)}
    .evtbtn.ec{border-color:var(--orgb);background:var(--orgp)}
    .evtbtn.es{border-color:#bcd0ee;background:var(--blp)}
    .evtbtn.eyel{border-color:#fde047;background:var(--ylp)}
    .evtbtn.ered{border-color:#fca5a5;background:var(--rdp)}
    .evtbtn.epen{border-color:var(--grnb);background:#fff}
    .evtbtn.efk{border-color:var(--bdr);background:#fff}
    .evtbtn.einj{border-color:#d8b4fe;background:#faf5ff}
    .seg button.absent{background:var(--rd);color:#fff}
    .today-banner{background:var(--blk);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;border-left:5px solid var(--org)}
    .today-banner h3{font-size:14px;font-weight:700;color:var(--org);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    .today-match{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}
    .today-match:first-of-type{padding-top:0;border-top:none}
    .today-match .tm-info{flex:1}
    .today-match .tm-opp{font-size:15px;font-weight:700}
    .today-match .tm-sub{font-size:12px;opacity:.7;margin-top:2px}
    .evtbtn.disabled{opacity:.35;pointer-events:none}
    /* Player row */
    .pn-inp{width:34px;height:34px;border:2px solid var(--bdr);border-radius:8px;font-size:14px;font-weight:700;text-align:center;padding:0 2px;-webkit-appearance:none;background:#fff;flex-shrink:0;color:var(--txt)}
    /* Een getalveld zet standaard pijltjes omhoog/omlaag in het veld. Die aten de breedte op, en dan
       was een rugnummer van twee cijfers niet meer te lezen. -webkit-appearance op het veld zelf is
       daarvoor niet genoeg: de knopjes zijn aparte onderdelen. Voor een rugnummer tik je het getal,
       dus die pijltjes missen we niet. */
    .pn-inp::-webkit-outer-spin-button,.pn-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .pn-inp{-moz-appearance:textfield;appearance:textfield}
    /* Meerdere wedstrijden tegelijk aanpassen: vinkje links, en een aangevinkte rij die je van een
       halve meter afstand nog ziet — je duidt er dertig aan en moet kunnen nakijken wat je hebt. */
    .bulk-vink{width:26px;height:26px;border-radius:7px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;margin-right:10px}
    .match-item.bulk-aan{border-color:var(--grn);background:var(--grnp)}
    .match-item.bulk-aan .bulk-vink{background:var(--grn);border-color:var(--grn)}
    body.dark .match-item.bulk-aan{background:#12291c}
    .prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bdr)}
    .prow:last-child{border-bottom:none}
    .pnum{width:34px;height:34px;border-radius:50%;background:var(--blk);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
    .pnum-off{background:#9ca3af}
    .pname{font-weight:600;font-size:15px}
    .ppos{font-size:12px;color:var(--txt2)}
    .pmins{margin-left:auto;font-size:13px;color:var(--txt2);font-weight:600;white-space:nowrap}
    .pedit{margin-left:8px;background:var(--grnp);border:none;color:var(--grn2);width:34px;height:34px;border-radius:8px;font-size:15px;cursor:pointer}
    /* Event log */
    .elog{list-style:none}
    .elog li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr);font-size:14px}
    .elog li:last-child{border-bottom:none}
    .emin{font-weight:800;color:var(--txt2);font-size:12px;min-width:42px}
    .etxt{flex:1}
    /* Event-log gegroepeerd per deel */
    .qgroup{margin-bottom:4px}
    .qgroup-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--blk2);padding:7px 11px;border-radius:8px;margin:12px 0 2px}
    .qgroup:first-child .qgroup-head{margin-top:0}
    .qgroup-score{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
    .qgroup-score .us{color:var(--grn)}
    /* "dit kwart: 0–3" onder de tussenstand — kleiner en niet vet, want de tussenstand blijft
       het hoofdgetal. Zie scoreInQuarter(). */
    .qgroup-dit{display:block;font-size:10.5px;font-weight:600;color:var(--txt2);letter-spacing:0;text-align:right;margin-top:1px}
    .qgroup .elog li{padding:8px 4px}
    .qgroup-empty{color:var(--txt2);font-size:13px;padding:8px 4px}
    /* Startopstelling per blok: één regel i.p.v. tientallen losse wissels (zie startLineupHtml).
       align-items:flex-start omdat deze regel over meerdere lijnen loopt, anders zweeft het icoon
       in het midden van een blok van vier regels. */
    .startlineup{align-items:flex-start!important;background:var(--org-pale,#fff3e0);border-radius:8px;padding:8px!important;margin-bottom:2px}
    .sl-lijst{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
    .sl-item{display:inline-flex;align-items:center;gap:4px;background:var(--card,#fff);border:1px solid var(--bdr);border-radius:6px;padding:2px 6px;font-size:12.5px}
    .sl-plek{font-weight:800;font-size:10.5px;color:var(--org2,#b45309);letter-spacing:.3px}
    /* Bank onder de startopstelling-regel: klein en grijs — het is de context, niet het nieuws. */
    .sl-bank{display:block;margin-top:5px;font-size:12px;color:var(--txt2)}
    /* Modal */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end}
    .toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:300;max-width:88vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:opacity .3s}
    .toast-ok{background:#166534;color:#dcfce7}
    .toast-err{background:#7f1d1d;color:#fee2e2}
    .toast-hide{opacity:0;pointer-events:none}
    .modal{background:var(--card);border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .modal h3{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center}
    .mopt{display:flex;align-items:center;gap:12px;padding:13px;border-radius:10px;border:2px solid var(--bdr);margin-bottom:8px;cursor:pointer;font-weight:600;font-size:15px;transition:all .15s}
    .mopt:active{transform:scale(.98)}
    .mopt.sel{border-color:var(--grn);background:var(--grnp)}
    .mopt-num{width:38px;height:38px;border-radius:50%;background:var(--blk);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
    .mopt-num-off{background:#9ca3af}
    .mopt-skip{border-style:dashed;justify-content:center;color:var(--txt2)}
    /* Toggle group */
    .tgl{display:flex;border:2px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:14px}
    .tgl button{flex:1;padding:11px;border:none;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--txt2)}
    .tgl button.act{background:var(--grn);color:#fff}
    /* Live tabs */
    .ltabs{display:flex;background:#fff;border-top:2px solid var(--bdr);position:sticky;bottom:0;z-index:50}
    .ltab{flex:1;padding:11px 6px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;color:var(--txt2);border:none;background:none}
    /* Oranje stipje op de Opstelling-tab tijdens de pauze: daar regel je de wissels. Let op:
       var(--org) is in deze app blauw (legacynaam), dus hier de echte merkoranje. */
    .ltab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f5821f;margin-left:4px;vertical-align:.1em}
    .ltab.act{color:var(--grn)}
    .ltab .ti{font-size:20px;display:block;margin-bottom:2px}
    /* Toast */
    #undo-toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:9100;max-width:88vw;text-align:center;display:flex;align-items:center;gap:8px;animation:splashFade .25s ease;pointer-events:none}
    /* FAB */
    .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;width:62px;height:62px;border-radius:31px;background:var(--org);color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
    .fab:active{transform:scale(.9)}
    .fab-note{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 12px);right:14px;width:44px;height:44px;border-radius:22px;background:var(--card);border:2px solid var(--bdr);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:49;padding:0;color:var(--txt)}
    .fab-note:active{transform:scale(.9)}
    .fab-note svg,.fab-mark svg{width:20px;height:20px;display:block}
    .fab-mark{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 68px);right:14px;width:44px;height:44px;border-radius:22px;background:var(--ylp,#fef9c3);border:2px solid var(--yl,#ca8a04);color:var(--yl,#ca8a04);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:49;padding:0}
    .fab-mark:active{transform:scale(.9)}
    /* Player input row */
    .pirow{display:grid;grid-template-columns:56px 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
    .pirow input,.pirow select{padding:10px;border:2px solid var(--bdr);border-radius:8px;font-size:15px;width:100%;-webkit-appearance:none;background:#fff}
    .pirow2{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
    .pirow2 select,.pirow2 input{padding:9px;border:2px solid var(--bdr);border-radius:8px;font-size:14px;width:100%;-webkit-appearance:none;background:#fff}
    .delbtn{width:38px;height:38px;border-radius:8px;background:var(--rdp);border:none;color:var(--rd);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    /* Start chip */
    .start-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .start-chip.on{background:var(--grn);border-color:var(--grn);color:#fff}
    /* Empty */
    .empty{text-align:center;padding:40px 20px;color:var(--txt2)}
    .empty .ei{font-size:52px;margin-bottom:12px}
    /* Divider */
    hr{border:none;border-top:2px solid var(--bdr);margin:14px 0}
    .danger{border-top:2px solid var(--rdp);padding-top:14px;margin-top:14px}
    /* Zelfde vorm als .danger, maar neutraal: scheidt de afsluitknoppen van wat erboven staat
       zonder ze als gevaarlijk te tekenen (Tim, 25-08-2026). */
    .afsluitzone{border-top:2px solid var(--bdr);padding-top:14px;margin-top:14px}
    .hidden{display:none!important}
    /* Donkere modus */
    body.dark{--bg:#0b1220;--card:#161f2e;--txt:#e8eaed;--txt2:#9aa6b2;--bdr:#2a3445}
    body.dark .fg input,body.dark .fg select,body.dark .fg textarea,body.dark .pirow input,body.dark .pirow select,body.dark .pirow2 input,body.dark .pirow2 select,body.dark .pn-inp,body.dark .filterbar select,body.dark .start-chip,body.dark .team-chip,body.dark .place-chip{background:#0f1828;color:var(--txt)}
    body.dark .evtbtn{background:#0f1828}
    body.dark .mopt{background:#0f1828}
    body.dark .credit b{color:var(--txt)}
    body.dark .mi-score{color:var(--txt)}
    body.dark .btn-gray{background:#243049;color:var(--txt)}
    body.dark .btn-pale{background:#16263f;color:#9cc0ff}
    body.dark .btn-orgpale{background:#3a2e16;color:#f8d79a}
    body.dark .btn-red{background:#3a1e1e;color:#fca5a5}
    body.dark .file-btn{background:#16263f;color:#9cc0ff}
    /* Back-up-herinnering */
    .backup-banner{background:var(--orgp);color:var(--org2);border:1px solid var(--orgb);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
    .backup-banner button{margin-left:auto;flex-shrink:0}
    /* Fair-play / speelminuten */
    .pmins-warn{color:var(--rd)!important;font-weight:800}
    .fairbar{height:6px;border-radius:3px;background:var(--bdr);overflow:hidden;margin-top:4px}
    .fairbar span{display:block;height:100%;background:var(--grn)}
    .fairbar.mid span{background:var(--orn)}
    .fairbar.low span{background:var(--rd)}
    .evt-edit{background:var(--grnp);border:none;color:var(--grn2);width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0}
    .searchbar input{width:100%;padding:11px;border:2px solid var(--bdr);border-radius:10px;font-size:15px;background:var(--card);color:var(--txt);-webkit-appearance:none;margin-bottom:10px}
    /* Home dashboard-tegels */
    .home-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
    .tile{background:var(--card);border:none;border-radius:14px;box-shadow:var(--shadow);padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--txt);border-bottom:3px solid #475569}
    .tile:active{transform:scale(.96)}
    .tile .ti{font-size:24px;line-height:1}
    .ti svg{width:1em;height:1em;display:block;margin:0 auto}
    .tile-fi{font-size:22px;display:block;margin:0 auto 1px;line-height:1}
    .ti i,.ltab i{font-size:1.1em;display:block;line-height:1;margin:0 auto}
    .ic-i i,.ei i{font-size:1em;display:inline-block;vertical-align:-.12em;line-height:1}
    .evtbtn .ei i{display:inline-block;vertical-align:middle}
    .empty .ei i{font-size:52px;display:block;margin:0 auto 8px}
    .evtbtn .ei svg{width:1em;height:1em;display:inline-block;vertical-align:middle}
    .ei svg,.ic-i svg{width:1em;height:1em;display:inline-block;vertical-align:-.1em}
    .tile .tl{font-size:14px;font-weight:800}
    /* Brede tegel zonder ondertitel (Agenda): icoon en naam naast elkaar, zodat ze lager blijft
       dan de vierkante tegels erboven. */
    .tile-breed{flex-direction:row;justify-content:center;gap:8px;padding:10px 6px}
    .tile-breed .tile-fi{margin:0;font-size:18px}
    .tile .tc{font-size:12px;color:var(--txt2);font-weight:600}
    /* Live: speeltijd-nudge + keeperkeuze */
    .nudge{background:var(--orgp);color:var(--org2);border:1px solid var(--orgb);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;font-weight:600;line-height:1.4}
    .nudge-fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
    .nudge-fold summary::-webkit-details-marker{display:none}
    .nudge-fold summary::after{content:'\25BE';margin-left:auto;font-size:15px;line-height:1;opacity:.65}
    .nudge-fold[open] summary::after{content:'\25B4'}
    .nudge-fold .nudge-body{margin-top:9px;font-size:13px;font-weight:400;color:var(--txt2);line-height:1.45}
    .keeper-chip{display:inline-flex;align-items:center;gap:6px;background:var(--orgp);color:var(--org2);border:2px solid var(--orgb);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
    /* Wizard */
    .steps{display:flex;gap:6px;padding:10px 16px 0;max-width:600px;margin:0 auto}
    .step-pill{flex:1;height:6px;border-radius:3px;background:var(--bdr)}
    .step-pill.on{background:var(--grn)}
    .step-pill.done{background:var(--grn2)}
    .wiz-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
    /* Basis · Wissel · NB zaten als segmented control tegen elkaar aan (nul pixels ertussen), zodat
       een tik die horizontaal een paar pixels afweek op de buurknop landde — de enige plek in dit
       scherm waar een misser een verkeerde uitkomst geeft i.p.v. geen uitkomst. Nu drie losse
       pillen met 5px ertussen. De ruimte daarvoor komt uit een smaller rugnummerveld en kleinere
       tussenruimtes in .selrow, zodat de rij niet breder wordt. De achtergrond gaat via een
       variabele i.p.v. hard #fff: zo kloppen ze ook in donkere modus. */
    .seg{display:flex;gap:5px;flex-shrink:0}
    .seg button{border:none;background:var(--bdr);border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer}
    .seg button.basis{background:var(--grn);color:#fff}
    .seg button.bank{background:var(--org);color:#fff}
    /* Reden bij NB — enkel zichtbaar zodra NB gekozen is, dus mag compact. */
    .abs-reason{display:block;margin-top:4px;font-size:12px;padding:3px 6px;border:1px solid var(--bdr);border-radius:7px;background:var(--card);color:var(--txt);max-width:170px}
    .selrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bdr)}
    .selrow:last-child{border-bottom:none}
    .selrow .pn{width:30px;height:30px;border-radius:50%;background:var(--blk);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
    .cap-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--bdr);background:#fff;color:var(--txt2);font-weight:800;font-size:10px;cursor:pointer;flex-shrink:0;line-height:1;padding:0}
    .cap-btn.on{background:#f5821f;border-color:#f5821f;color:#fff}
    .selrow .nm{flex:1;font-size:15px;font-weight:600;line-height:1.15}
    .selrow .nm small{display:block;font-weight:400;color:var(--txt2);font-size:11px}
    .guest-badge{font-size:10px;font-weight:700;background:var(--orgp);color:var(--org2);padding:1px 6px;border-radius:10px;margin-left:6px}
    /* Team list */
    .team-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border-left:5px solid var(--grn)}
    .team-row .tn{flex:1;font-size:16px;font-weight:700}
    .team-row .tc{font-size:12px;color:var(--txt2)}
    /* Placement chips */
    .place-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .place-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .place-chip.sel{border-color:var(--org);background:var(--orgp);color:var(--org2)}
    .place-chip .pcn{width:20px;height:20px;border-radius:50%;background:var(--blk);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    /* Pitch slots */
    /* Markering op een velddiagram: sinds v0.34.0 een SHIRT en niet langer een bol (zie shirtSvg in
       core.js, dat het pad van IC.shirt gebruikt). .pslot en .pdot doen nu enkel nog de plaatsing en
       de grootte; de vorm, de vulling en het cijfer zitten in de SVG. Daardoor blijven ze allebei
       automatisch hetzelfde tonen — ze waren uit elkaar gegroeid als bol met en zonder rand. */
    /* De grootte hangt aan de BREEDTE van het veld, niet aan een vast aantal pixels. 18% is 61px op een
       veld van 340px (de max-breedte), en dat is ruim boven de 44px die een vingertop nodig heeft. Vaste
       pixels liepen mis op een smal toestel: daar krimpt het veld tot 252px terwijl het shirt bleef staan,
       en dan liep een naamplaatje over het shirt van de rij eronder. De labels hangen daarom ook aan de
       onderkant van het vakje (top:100%) i.p.v. op een vaste hoogte. */
    .pslot,.pdot{position:absolute;transform:translate(-50%,-50%);width:18%;aspect-ratio:1/1;cursor:pointer}
    .pmark-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
    .pmark-txt{font-size:7.5px;font-weight:700;fill:#fff}
    /* Code onder een LEGE plek: lichter dan een spelersnaam, want het is een plaatsnaam en geen
       persoon. Verdwijnt zodra er iemand staat (dan komt de naam hier). */
    .pmark-code{position:absolute;top:100%;margin-top:-6%;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.3px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.3);border-radius:5px;padding:0 3px;white-space:nowrap}
    /* Een open plek van het rooster staat kleiner en lichter dan een bezet shirt, anders wordt een veld
       met 26 plekken één grijze massa. De plekken van de gekozen formatie (.pslot-tip) lichten sterker
       op én staan groter: dat is het voorstel, geen verplichting. */
    .pslot-open .pmark-svg{opacity:.5;transform:scale(.66)}
    .pslot-open .pmark-code{opacity:.6;font-size:8px;top:83%;margin-top:0}
    /* Formatieplekken (met positienummer) iets groter dan de overige vrije plekken — bij een leeg
       veld leest dat als "hier hoort iemand". */
    .pslot-open.pslot-vorm .pmark-svg{opacity:.62;transform:scale(.88)}
    .pslot-open.pslot-vorm .pmark-code{opacity:.8;font-size:9px;top:92%}
    /* Er wordt een speler vastgehouden: elke vrije plek is een bestemming en toont dat. */
    .pslot-open.pslot-doel{outline:2px dashed var(--org);outline-offset:-1px;border-radius:10px}
    .pslot-open.pslot-doel .pmark-svg{opacity:.8}
    .pslot-open.pslot-tip .pmark-svg{opacity:.92;transform:scale(.9)}
    .pslot-open.pslot-tip .pmark-code{opacity:1;font-size:9px;top:95%;margin-top:0}
    /* Zelfde opmaak als .pdot-lbl op het live-veld: even breed en met een donker plaatje eronder,
       zodat labels die bij lange namen tegen elkaar aanschuiven leesbaar blijven. */
    .pslot-lbl{position:absolute;top:100%;margin-top:-6%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:92px;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.42);border-radius:5px;padding:1px 4px;z-index:2}
    /* Pitch (visual field) */
    .pitch{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:2/3;background:repeating-linear-gradient(to bottom,#1b8040 0px,#1b8040 30px,#1e9449 30px,#1e9449 60px);border-radius:12px;border:3px solid #fff;overflow:hidden;box-shadow:var(--shadow)}
    .pitch-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    /* Naamlabel onder het shirt: donker doorschijnend plaatje eronder, zodat twee labels die bij
       lange familienamen tegen elkaar aanschuiven toch leesbaar blijven (i.p.v. wit-op-gras
       dat in elkaar overloopt). z-index tilt het label boven de buurbol. */
    .pdot-lbl{position:absolute;top:100%;margin-top:-6%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:92px;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.42);border-radius:5px;padding:1px 4px;z-index:2}
    /* Wisselkader onder het veld. Stond vroeger als regeltjes bij de bollen, maar het diagram toont
       de opstelling bij de START van het deel en negeert positiewisselingen — een naam onder een bol
       beweerde dan een positie die de invaller misschien nooit speelde. Hier staat enkel wie en
       wanneer. Kaarten staan niet meer op het veld: die staan in de tijdlijn. */
    .pitch-subs{max-width:340px;margin:8px auto 0;border:1px solid var(--bdr);border-radius:10px;padding:6px 9px}
    .pitch-subs-h{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--txt2);margin-bottom:3px}
    .psr{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:2px 0;min-width:0}
    .psr-min{min-width:32px;color:var(--txt2);font-variant-numeric:tabular-nums;flex-shrink:0}
    /* Enkel de pijltjes gekleurd; de namen in de gewone tekstkleur, zodat de regel rustig leest.
       Twee gelijke kolommen die mogen afbreken: bij een dubbele wissel staan er meerdere namen. */
    .psr-uit,.psr-in{display:flex;align-items:flex-start;gap:3px;min-width:0;flex:1;color:var(--txt)}
    .psr-pos{display:flex;align-items:flex-start;gap:3px;min-width:0;flex:1;color:var(--txt)}
  /* Positiewissel: één zin over de volle breedte i.p.v. twee kolommen, want er is geen eraf/erin. */
  .psr-pos .ic-i{color:var(--blu,#2f74bd)}
  .psr-uit .ic-i{color:var(--rd)}
    .psr-in .ic-i{color:var(--grn)}
    .psr .ic-i{width:11px;height:11px;flex-shrink:0;margin-top:2px}
    .pitch-bench{max-width:340px;margin:8px auto 0;font-size:12px;color:var(--txt2);line-height:1.5;text-align:center}
    .field-legend{text-align:center;font-size:11px;color:var(--txt2);margin-top:8px}
    /* Lineup carousel */
    /* HET MOMENT-KADER (Tim, 26-08-2026). De chips, het veld en de bank horen bij ÉÉN moment in het
       blok en wisselen samen mee; wat eronder staat (de geplande wissels) geldt voor het hele blok.
       Zonder rand las dat als één geheel, en dan lijkt "Geplande wissels tijdens dit kwart" bij de
       getoonde opstelling te horen in plaats van bij het kwart. */
    .planmoment{border:1px solid var(--bdr);border-radius:14px;padding:12px 12px 14px;background:rgba(0,0,0,.02)}
    body.dark .planmoment{background:rgba(255,255,255,.03)}
    .lc-wrap{position:relative}
    .lc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .lc-nav-lbl{font-size:13px;font-weight:700;color:var(--txt2)}
    .lc-btn{background:var(--blk2);color:#fff;border:none;border-radius:8px;width:34px;height:34px;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .lc-btn:disabled{opacity:.25;cursor:default}
    /* Splash */
    #splash{position:fixed;inset:0;background:url('background_logo.jpg') center/cover no-repeat;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:none}
    #splash::before{content:'';position:absolute;inset:0;background:rgba(10,18,35,0.55)}
    #splash img{width:140px;height:140px;object-fit:contain;position:relative}
    #splash-bar{width:150px;height:3px;background:var(--grn);border-radius:2px;transform:scaleX(0);transform-origin:center;position:relative;animation:splashBar 1s .4s cubic-bezier(.22,1,.36,1) forwards}
    #splash-titles{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;opacity:0;animation:splashFade .5s .7s ease forwards}
    #splash-title{color:#fff;font-size:24px;font-weight:800;letter-spacing:2px;font-variant:small-caps}
    #splash-name{color:rgba(255,255,255,0.55);font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
    #splash-spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;position:relative;display:none;animation:splashSpin .8s linear infinite}
    @keyframes splashLogo{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @keyframes splashBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes splashFade{from{opacity:0}to{opacity:1}}
    @keyframes splashSpin{to{transform:rotate(360deg)}}
    /* Print */
    @media print{
      .ltabs,.fab,.fab-note,.fab-mark,.hdr,.no-print{display:none!important}
      body{background:#fff}
      .content{max-width:100%;padding:0}
    }
    .cloud-chip{cursor:pointer;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;user-select:none}
    .cloud-chip.admin{background:#1f9d55;color:#fff}
    .cloud-chip.viewer{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.45)}
    .req-badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:5px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;text-align:center;vertical-align:middle}
    .viewer-banner{background:#eef4ff;border:1px solid #c7dafc;color:#1d4ed8;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;text-align:center;margin-bottom:12px}
    /* Auth / team-select schermen */
    .auth-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg);gap:12px}
    .auth-hero{width:100%;max-width:400px;background:url('background_logo.jpg') center/cover no-repeat;border-radius:18px;padding:12px 24px 12px;text-align:center;position:relative;overflow:hidden}
    .auth-hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);border-radius:18px}
    .auth-hero>*{position:relative;z-index:1}
    .auth-hero-dot1{display:none}
    .auth-hero-dot2{display:none}
    .auth-logo{font-size:52px;margin-bottom:8px}
    .auth-logo-img{height:128px;width:128px;object-fit:contain;border-radius:0}
    /* GEEN text-transform:uppercase erbij: dat maakt van elke letter een echte hoofdletter, en klein
       kapitaal werkt enkel op kleine letters. De twee samen hieven elkaar op. Zo blijven de M en de D
       volle hoofdletters en worden de rest kleine kapitalen. */
    .auth-title{font-size:20px;font-weight:900;color:#fff;margin:4px 0 2px;letter-spacing:2px;font-variant:small-caps}
    .auth-sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:1.2px;text-transform:uppercase}
    .auth-box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:400px}
    .auth-welcome{font-size:16px;font-weight:800;color:var(--txt);margin-bottom:2px}
    .auth-welcome-sub{font-size:13px;color:var(--txt2);margin-bottom:18px}
    .auth-tabs{display:flex;gap:6px;margin-bottom:20px}
    .auth-tab{flex:1;padding:11px;border:none;background:var(--bg);border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;color:var(--txt2)}
    .auth-tab.act{background:var(--blk);color:#fff}
    .auth-err{color:var(--rd);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px}
    .ts-wrap{min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
    .ts-hdr{background:url('background_logo.jpg') center/cover no-repeat;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:none;position:relative;overflow:hidden}
    .ts-hdr::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5)}
    .ts-hdr>*{position:relative;z-index:1}
    .ts-hdr h1{font-size:20px;font-weight:900}
    .ts-logo{height:52px;width:auto;object-fit:contain;flex-shrink:0}
    .ts-hdr-text{display:flex;flex-direction:column;text-align:left;flex:1}
    .ts-hdr-name{font-size:18px;font-weight:900;color:#fff;letter-spacing:1.5px;font-variant:small-caps;line-height:1.1}
    .ts-hdr p{font-size:12px;color:rgba(255,255,255,.6);margin:2px 0 0}
    .ts-content{padding:20px;max-width:500px;margin:0 auto;width:100%}
    .ts-team-row{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:14px;border-left:5px solid var(--grn);transition:transform .1s}
    .ts-team-row:active{transform:scale(.98)}
    .ts-team-row .ts-name{font-size:17px;font-weight:800;flex:1}
    .ts-role{font-size:12px;font-weight:700;color:var(--txt2)}
    .ts-role.admin{color:var(--grn2)}
    .ts-role.viewer{color:var(--txt2)}
    .ts-drag-handle{display:flex;align-items:center;color:var(--txt2);cursor:grab;touch-action:none;margin:-8px -4px -8px -10px;padding:8px 4px}
    .ts-team-row.dragging{opacity:.5}
    .team-switch-btn{background:var(--org);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:7px 16px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-shrink:0}
    .team-switch-btn:active{background:var(--org2);transform:scale(.97)}
    .hdr-club-name{font-size:18px;font-weight:900;color:#fff;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* De clubnaam onder de ploegnaam heeft ~127px nodig en past op een telefoon niet naast de
       knoppen Ploeg/Beheer plus het tandwiel — hij werd daar altijd afgekapt. Hij staat toch al
       voluit in de footer van elke pagina, dus tonen we hem enkel als er echt plaats is. */
    .hdr-club-sub{display:none;font-size:12px;font-weight:600;color:#fff;opacity:.75;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(min-width:430px){.hdr-club-sub{display:block}}
    .invite-code{font-size:28px;font-weight:900;letter-spacing:6px;text-align:center;padding:16px;background:var(--grnp);border-radius:12px;color:var(--grn2);margin:12px 0;font-family:monospace}
    body.dark .auth-box{background:var(--card)}
    body.dark .auth-tab{background:var(--blk2);color:var(--txt)}
    body.dark .auth-tab.act{background:#fff;color:var(--blk)}
    body.dark .ts-team-row{background:var(--card)}
    /* Handleiding */
    .hdl-tabs{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bdr)}
    .hdl-tab{background:none;border:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--txt2);cursor:pointer;transition:background .15s}
    .hdl-tab:hover{background:var(--bg)}
    .hdl-tab.active{background:var(--grn);color:#fff;font-weight:600}
    .hdl-body{padding:16px 16px 32px}
    .hdl-titel{font-size:19px;font-weight:700;margin-bottom:14px;color:var(--txt)}
    /* Schermafbeeldingen zijn gsm-opnames van 430x932. Met width:100% werden ze in een body van
       600 px opgeblazen tot 568 px breed (dus onscherp) en ruim 1200 px hoog. Nu geplafonneerd op
       300 px en gecentreerd; wie details wil lezen, zoomt in met een pinch (de viewport-regel laat
       dat toe). */
    .hdl-shots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
    .hdl-img{width:100%;max-width:300px;border-radius:10px;border:1px solid var(--bdr);display:block}
    /* min-width:0 is nodig: een img als flex-item heeft standaard min-width:auto, en dat is voor een
       afbeelding haar eigen breedte (430 px) — twee daarvan passen niet in de kolom, waardoor ze
       altijd onder elkaar sprongen i.p.v. naast elkaar. */
    .hdl-shots .hdl-img{flex:1 1 240px;min-width:0}
    /* Een beeld dat MIDDEN in de uitleg staat (zie {{img2}} in renderHandleiding): het hoort bij de
       tekst eromheen, dus het krijgt lucht boven en onder en blijft op zijn eigen breedte staan
       i.p.v. uit te rekken zoals wanneer er twee naast elkaar staan. */
    .hdl-shots-inline{margin:12px 0 16px}
    .hdl-shots-inline .hdl-img{flex:0 1 300px}
    .hdl-list{padding-left:20px;margin:8px 0;line-height:1.8;font-size:14px;color:var(--txt)}
    .hdl-list li{margin-bottom:4px}
    .hdl-rol{display:flex;flex-direction:column;background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
    .hdl-rol b{font-size:15px;margin-bottom:2px}
    .hdl-rol span{color:var(--txt2)}
    .hdl-tip{background:var(--bg);border-left:3px solid var(--grn);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--txt2);margin-top:12px}
    .hdl-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:8px}
    .hdl-nav .btn{min-width:100px}
    @media(min-width:600px){.hdl-tabs{flex-direction:row;flex-wrap:wrap;gap:6px}.hdl-tab{font-size:13px;padding:6px 12px}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="hidden"></div>
<div id="splash"><img src="logo_no_background.png" alt="MatchDelegate"><div id="splash-bar"></div><div id="splash-titles"><div id="splash-title">MatchDelegate</div><div id="splash-name">Manage &nbsp;•&nbsp; Track &nbsp;•&nbsp; Share</div></div><div id="splash-spinner"></div></div>
<!-- Handleiding screenshots (base64) — genereer via: handleiding\generate-b64.ps1
     Wordt pas geladen bij PDF-export van de handleiding (792KB, hoeft niet bij elke opstart). -->
<script>var HANDLEIDING_SCREENSHOTS = {};</script>
<!-- Firebase (cloud delen). Lokaal gehost + in SW-precache zodat de SDK ook offline laadt. -->
<script src="firebase/firebase-app-compat.js"></script>
<script src="firebase/firebase-auth-compat.js"></script>
<script src="firebase/firebase-database-compat.js"></script>
<!-- QR Code Generator (Kazuhiko Arase, MIT) — lokaal i.p.v. api.qrserver.com, zodat de
     uitnodigings-QR ook zonder internet werkt en de code niet naar een derde partij gaat. -->
<script src="qr/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/views-account.js"></script>
<script src="js/stats-settings.js"></script>
<script src="js/teams-tournaments.js"></script>
<script src="js/wizard-prep.js"></script>
<script src="js/live-match.js"></script>
<script src="js/detail-pdf.js"></script>
<script src="js/import-cal.js"></script>
<script src="js/import-psd.js"></script>
</body>
</html>
